name: Publish Site

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-22.04
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          summarize: ${{ runner.debug == '1' }}
      - uses: DeterminateSystems/magic-nix-cache-action@14645543c3b214bedad3b9b49775cb042f4c1fc7 # main
      - name: Build Site
        run: nix develop --command zola build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public
  
  publish:
    name: Publish Site
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      id-token: "write"
      pages: "write"
    steps:
      - name: Publish to Github Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  check-format:
    name: Check Format
    runs-on: ubuntu-22.04
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          summarize: ${{ runner.debug == '1' }}
      - uses: DeterminateSystems/magic-nix-cache-action@14645543c3b214bedad3b9b49775cb042f4c1fc7 # main
      - name: Check Format
        run: nix flake check

  check-broken-links:
    name: Check for Broken Links
    runs-on: ubuntu-22.04
    needs: publish
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          summarize: ${{ runner.debug == '1' }}
      - uses: DeterminateSystems/magic-nix-cache-action@14645543c3b214bedad3b9b49775cb042f4c1fc7 # main
      - name: Crawl Site for Page URLs
        run: |
          wget --spider --recursive --no-directories --no-verbose \
               --output-file=- https://giodamelio.com/ 2>&1 \
            | grep -oP 'https://giodamelio\.com[^\s"]*' \
            | grep -v '\.\(css\|png\|jpg\|svg\|ico\|xml\|txt\|js\)$' \
            | sort -u >> .lychee-urls.txt
      - name: Check Links
        run: nix develop --command lychee "https://giodamelio.com" --no-progress --output="$GITHUB_STEP_SUMMARY" --verbose
  
  lighthouse:
    name: Audit Site with Lighthouse
    runs-on: ubuntu-22.04
    needs: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Audit URL using Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        id: lighthouse
        with:
          urls: |
            https://giodamelio.com
            https://giodamelio.com/blog/
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Display Report
        uses: jackywithawhitedog/lighthouse-viewer-action@068872e7ed5f3709e2024a24c3341e1b03a1f447 # v2
        with:
          resultsPath: ${{ steps.lighthouse.outputs.resultsPath }}
          lighthouseOutcome: ${{ steps.lighthouse.outcome }}
  
  wayback-machine:
    name: Save Site to the Wayback Machine
    runs-on: ubuntu-22.04
    needs: publish
    steps:
      - name: Save to Wayback Machine
        uses: JamieMagee/wayback@e561c5018fb0e62988fddd732fb88345a3faa608 # v2.2.0
        with:
          url: https://giodamelio.com


